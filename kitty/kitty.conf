# Theming
include ~/.local/state/quickshell/user/generated/terminal/kitty-theme.conf

# Font
font_family      JetBrains Mono Nerd Font
font_size 11.0

# Cursor
cursor_shape beam
cursor_trail 1

# Padding (why weird value? consistency with foot)
window_margin_width 21.75

# No stupid close confirmation
confirm_os_window_close 0

# Use fish shell
shell fish

# Copy
map ctrl+c    copy_or_interrupt
map ctrl+แ    copy_or_interrupt
map ctrl+ฉ    copy_or_interrupt

# Thai layout support for Copy/Paste
map ctrl+shift+c copy_to_clipboard
map ctrl+shift+แ copy_to_clipboard
map ctrl+shift+ฉ copy_to_clipboard

map ctrl+shift+v paste_from_clipboard
map ctrl+shift+อ paste_from_clipboard
map ctrl+shift+ฮ paste_from_clipboard

# Thai layout support for Tabs & Windows
map ctrl+shift+ะ new_tab
map ctrl+shift+ั new_tab
map ctrl+shift+ไ close_tab
map ctrl+shift+ํ close_tab
map ctrl+shift+ื new_window
map ctrl+shift+์ new_window


# Search
map ctrl+f   launch --location=hsplit --allow-remote-control kitty +kitten search.py @active-kitty-window-id
map kitty_mod+f   launch --location=hsplit --allow-remote-control kitty +kitten search.py @active-kitty-window-id

# Scroll & Zoom
map page_up    scroll_page_up
map page_down    scroll_page_down

map ctrl+plus  change_font_size all +1
map ctrl+equal  change_font_size all +1
map ctrl+kp_add  change_font_size all +1
map ctrl+minus       change_font_size all -1
map ctrl+underscore       change_font_size all -1
map ctrl+kp_subtract       change_font_size all -1
map ctrl+0 change_font_size all 0
map ctrl+kp_0 change_font_size all 0

background #0b0f14
background_opacity 0.90
dynamic_background_opacity yes
background_blur 64

# ปิด background_image เดิม
background_image none

# ใช้ logo กลางหน้าต่างแทน
window_logo_path schale_logo.png
window_logo_position center
window_logo_alpha 0.30

# scale เป็น % ของด้านที่สั้นที่สุดของ window
window_logo_scale 55
